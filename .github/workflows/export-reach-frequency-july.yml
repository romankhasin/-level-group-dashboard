name: Export July Reach Frequency

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-reach-frequency-july.yml"
      - "scripts/export_reach_frequency_july.py"

permissions:
  contents: write

concurrency:
  group: export-july-reach-frequency
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export July Reach/Frequency
        env:
          TARGETADS_TOKEN: ${{ secrets.TARGETADS_TOKEN }}
          TARGETADS_PROJECT_ID: ${{ secrets.TARGETADS_PROJECT_ID }}
        run: python scripts/export_reach_frequency_july.py

      - name: Commit export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reach_frequency_july_2026.json
          if git diff --cached --quiet; then
            echo "No export changes"
          else
            git commit -m "Export July Reach Frequency"
            git push
          fi
