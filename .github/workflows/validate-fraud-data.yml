name: Apply and validate MI antifraud backend

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply pending MI backend migration
        run: |
          if [ -f scripts/apply_mi_stages_1_2.py ]; then
            python scripts/apply_mi_stages_1_2.py
          fi
          rm -f scripts/.mi-backend-trigger

      - name: Validate Python and aggregation
        run: |
          python -m py_compile scripts/fraud_visit_classifier.py scripts/update_fraud_data.py scripts/update_clientid_periods.py
          python scripts/fraud_visit_classifier.py
          python scripts/update_fraud_data.py --self-test
          python scripts/update_clientid_periods.py --self-test

      - name: Commit applied backend files to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows/validate-fraud-data.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No backend migration changes"
          else
            git commit -m "Add MI baseline and drill-down data"
            git push origin HEAD:${{ github.head_ref }}
          fi
