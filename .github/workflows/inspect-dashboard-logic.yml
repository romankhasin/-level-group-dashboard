name: Inspect dashboard merge logic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Print relevant dashboard code
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          lines = text.splitlines()
          patterns = [
              'AUTOMATIC_GOOGLE_VERIFIER_ROWS',
              'googleVerifierCoverageKeys',
              'verifierSourceRowKey',
              'mergeVerifier',
              'has_actual_cost',
              'plannedCpm',
              'planCpm',
              'CPM',
              'budget',
              'cost',
              'Target Ads',
          ]
          windows=[]
          for i, line in enumerate(lines):
              if any(p.lower() in line.lower() for p in patterns):
                  start=max(0,i-10); end=min(len(lines),i+24)
                  if any(not (end < a or start > b) for a,b in windows):
                      continue
                  windows.append((start,end))
          for start,end in windows:
              print(f'\n===== LINES {start+1}-{end} =====')
              for j in range(start,end):
                  print(f'{j+1:05d}: {lines[j]}')
          PY
