name: Export Reach Frequency August 1-16

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-reach-frequency-august-1-16.yml"
      - "scripts/export_reach_frequency_august_leaf.py"
      - "scripts/export_reach_frequency_august_fast.py"
      - "scripts/reach_frequency_august_chunk.py"
      - "scripts/reach_frequency_august_merge.py"

permissions:
  contents: write

concurrency:
  group: export-august-1-16-reach-frequency
  cancel-in-progress: false

jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { idx: "01", start: "2026-08-01", end: "2026-08-03" }
          - { idx: "02", start: "2026-08-04", end: "2026-08-06" }
          - { idx: "03", start: "2026-08-07", end: "2026-08-09" }
          - { idx: "04", start: "2026-08-10", end: "2026-08-12" }
          - { idx: "05", start: "2026-08-13", end: "2026-08-15" }
          - { idx: "06", start: "2026-08-16", end: "2026-08-16" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyroaring==1.1.0
      - name: Process chunk
        env:
          TARGETADS_TOKEN: ${{ secrets.TARGETADS_TOKEN }}
          TARGETADS_PROJECT_ID: ${{ secrets.TARGETADS_PROJECT_ID }}
        run: python scripts/reach_frequency_august_chunk.py --from-date "${{ matrix.start }}" --to-date "${{ matrix.end }}" --out "chunk-${{ matrix.idx }}.pkl"
      - uses: actions/upload-artifact@v4
        with:
          name: reach-august-1-16-chunk-${{ matrix.idx }}
          path: chunk-${{ matrix.idx }}.pkl
          compression-level: 0
          retention-days: 1

  aggregate:
    needs: chunk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyroaring==1.1.0
      - uses: actions/download-artifact@v4
        with:
          pattern: reach-august-1-16-chunk-*
          path: chunks
          merge-multiple: true
      - run: python scripts/reach_frequency_august_merge.py --input chunks --out data/reach_frequency_august_1_16_2026.json --from-date 2026-08-01 --to-date 2026-08-16
      - name: Commit export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reach_frequency_august_1_16_2026.json
          if git diff --cached --quiet; then
            echo "No export changes"
          else
            git commit -m "Export August 1-16 Reach Frequency"
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              git pull --rebase origin main
            done
            exit 1
          fi
