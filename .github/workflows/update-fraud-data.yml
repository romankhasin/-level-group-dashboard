name: Update fraud analysis data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-fraud-data.yml"
      - "scripts/update_fraud_data.py"
      - "scripts/update_clientid_periods.py"
      - "scripts/apply_mi_stages_1_2.py"
      - ".github/workflows/apply-mi-stages-1-2.yml"
  schedule:
    # GitHub Actions uses UTC. 03:30 UTC = 06:30 Moscow.
    - cron: "30 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-fraud-analysis-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply pending MI migration
        run: |
          if [ -f scripts/apply_mi_stages_1_2.py ]; then
            python scripts/apply_mi_stages_1_2.py
          fi

      - name: Validate aggregation locally
        run: |
          python scripts/update_fraud_data.py --self-test
          python scripts/update_clientid_periods.py --self-test

      - name: Commit applied MI code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No pending MI code changes"
          else
            git commit -m "Add MI baseline and drill-down data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Download Logs API data and build safe summaries
        id: build
        continue-on-error: true
        env:
          YANDEX_METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
        run: |
          python -u scripts/update_fraud_data.py
          python -u scripts/update_clientid_periods.py

      - name: Commit refreshed fraud summaries
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No fraud data changes"
          else
            git commit -m "Update fraud analysis data and MI diagnostics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fail when Logs API update failed
        if: steps.build.outcome != 'success'
        run: exit 1
