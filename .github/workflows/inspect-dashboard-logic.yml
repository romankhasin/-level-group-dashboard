name: Inspect dashboard merge logic

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract selected functions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          text=Path('index.html').read_text(encoding='utf-8')
          selected={
            'applyPlan','mergeDirectPlan','currentVerifierRows','isGoogleVerifierSource',
            'isYandexMtsPrgVerifierRow','verifierSourceRowKey','googleVerifierCoverageKeys',
            'rebuildVerifierRowsFromSources','normalizeVerifierRows','verifierRowsFromFiles',
            'getPeriodPlanMetric','getPeriodPlanValues','applyVerifier','parseVerifierRows'
          }

          def extract(start):
              brace=text.find('{',start)
              depth=0; quote=None; escape=False
              for i in range(brace,len(text)):
                  ch=text[i]
                  if quote:
                      if escape: escape=False
                      elif ch=='\\': escape=True
                      elif ch==quote: quote=None
                      continue
                  if ch in ('"',"'",'`'): quote=ch
                  elif ch=='{': depth+=1
                  elif ch=='}':
                      depth-=1
                      if depth==0: return text[start:i+1]
              return ''

          out=['## Selected merge and budget functions']
          pattern=re.compile(r'(^|\n)([ \t]*function\s+([A-Za-z0-9_$]+)\s*\([^\n]*\)\s*\{)',re.M)
          for m in pattern.finditer(text):
              name=m.group(3)
              if name not in selected: continue
              start=m.start(2)
              line=text.count('\n',0,start)+1
              block=extract(start)
              out.append(f'\n### {name} · line {line}\n```javascript\n{block}\n```')
          Path('inspection-comment.md').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Post inspection to PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file inspection-comment.md
