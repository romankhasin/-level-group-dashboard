name: Update fraud analysis data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-fraud-data.yml"
      - "scripts/update_fraud_data.py"
      - "scripts/update_clientid_periods.py"
      - "scripts/apply_goal_time_buckets.py"
  schedule:
    # GitHub Actions uses UTC. 03:30 UTC = 06:30 Moscow.
    - cron: "30 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-fraud-analysis-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply goal timing buckets
        run: |
          if [ -f scripts/apply_goal_time_buckets.py ]; then
            python scripts/apply_goal_time_buckets.py
          fi

      - name: Validate aggregation locally
        run: |
          python -m py_compile scripts/fraud_visit_classifier.py scripts/update_fraud_data.py scripts/update_clientid_periods.py
          python scripts/fraud_visit_classifier.py
          python scripts/update_fraud_data.py --self-test
          python scripts/update_clientid_periods.py --self-test
          grep -q '"fastAnyGoal3Visits"' scripts/update_clientid_periods.py
          grep -q '3 < minimum_any <= 15' scripts/update_clientid_periods.py

      - name: Commit goal timing code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update_clientid_periods.py
          if git diff --cached --quiet; then
            echo "Goal timing code is already current"
          else
            git commit -m "Split goal timing into 0-3, 4-15 and 16-30 seconds"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Refresh daily fraud summaries
        id: build
        continue-on-error: true
        env:
          YANDEX_METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
        run: python -u scripts/update_fraud_data.py

      - name: Rebuild exact period metrics
        id: period
        continue-on-error: true
        env:
          YANDEX_METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
        run: |
          if [ -f scripts/apply_goal_time_buckets.py ] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "${{ github.event_name }}" == "schedule" && "$(date -u +%u)" == "7" ]]; then
            python -u scripts/update_clientid_periods.py
          else
            echo "Skipping exact period rebuild on a regular daily run"
          fi

      - name: Commit refreshed fraud summaries
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data/fraud ]; then
            git add data/fraud
          fi
          if git diff --cached --quiet; then
            echo "No fraud data changes"
          else
            git commit -m "Update fraud analysis data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fail when refresh failed
        if: steps.build.outcome != 'success' || steps.period.outcome == 'failure'
        run: exit 1
