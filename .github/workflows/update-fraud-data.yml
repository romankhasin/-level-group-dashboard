name: Update fraud analysis data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-fraud-data.yml"
      - "scripts/update_fraud_data.py"
      - "scripts/update_clientid_periods.py"
      - "scripts/apply_cookie_methodology_v4.py"
      - "scripts/.cookie-methodology-v4-trigger"
  schedule:
    # GitHub Actions uses UTC. 03:30 UTC = 06:30 Moscow.
    - cron: "30 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-fraud-analysis-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply cookie methodology v4
        run: |
          python scripts/apply_cookie_methodology_v4.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/update_clientid_periods.py')
          text = path.read_text(encoding='utf-8')
          block_start = text.index('# Cookie methodology v4')
          marker = 'def _subtract_stats(total: dict, part: dict) -> dict:\n'
          marker_index = text.index(marker, block_start)
          override = '''def metric_rates(metrics: dict) -> dict:
              visits = int(metrics.get("visits") or 0)
              return {
                  "visits": visits,
                  "bounce": int(metrics.get("bounceVisits") or 0) / visits if visits else 0.0,
                  "time": int(metrics.get("durationSum") or 0) / visits if visits else 0.0,
                  "depth": int(metrics.get("pageViewsSum") or 0) / visits if visits else 0.0,
                  "quality": int(metrics.get("qualityVisits") or 0) / visits if visits else 0.0,
                  "newShare": int(metrics.get("newVisits") or 0) / visits if visits else 0.0,
              }


'''
          if 'def metric_rates(metrics: dict) -> dict:' not in text[block_start:marker_index]:
              text = text[:marker_index] + override + text[marker_index:]
          path.write_text(text, encoding='utf-8')
          PY
          git checkout HEAD -- .github/workflows/apply-cookie-methodology-v4.yml
          git checkout HEAD -- .github/workflows/validate-fraud-data.yml
          git checkout HEAD -- scripts/apply_cookie_methodology_v4.py
          git checkout HEAD -- scripts/.cookie-methodology-v4-trigger

      - name: Validate aggregation locally
        run: |
          python -m py_compile scripts/update_clientid_periods.py
          python scripts/update_fraud_data.py --self-test
          python scripts/update_clientid_periods.py --self-test
          grep -q "PERIOD_VERSION = 4" scripts/update_clientid_periods.py
          grep -q "def parse_cookie_status" scripts/update_clientid_periods.py
          grep -q '"clientIdByCookie": client_by_cookie' scripts/update_clientid_periods.py
          grep -q '"technicalSegments": segment_summaries' scripts/update_clientid_periods.py
          grep -q '"technicalIntersections"' scripts/update_clientid_periods.py
          grep -q '"dailyTypicalShare"' scripts/update_clientid_periods.py
          grep -q '"dailyMaxDate"' scripts/update_clientid_periods.py

      - name: Commit cookie methodology code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update_clientid_periods.py
          if git diff --cached --quiet; then
            echo "Cookie methodology code is already current"
          else
            git commit -m "Segment cookies and technical fraud diagnostics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Download Logs API data and build safe summaries
        id: build
        continue-on-error: true
        env:
          YANDEX_METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
        run: |
          python -u scripts/update_fraud_data.py
          python -u scripts/update_clientid_periods.py

      - name: Commit refreshed fraud summaries
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data/fraud ]; then
            git add data/fraud
          fi
          if git diff --cached --quiet; then
            echo "No fraud data changes"
          else
            git commit -m "Update fraud analysis data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fail when Logs API update failed
        if: steps.build.outcome != 'success'
        run: exit 1
