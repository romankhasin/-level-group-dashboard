<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Performance Dashboard в составе Level Digital Hub" />
  <title>Performance Dashboard · Level Digital Hub</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/navigation.css" />

  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f7f4ef;
      font-family: "Montserrat", Arial, sans-serif;
    }

    body {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .dashboard-frame {
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    .frame-fallback {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 10;
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      padding: 0 16px;
      border: 1px solid rgba(156, 107, 67, 0.2);
      border-radius: 999px;
      color: #20233a;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 12px 36px rgba(32, 35, 58, 0.12);
      text-decoration: none;
      font-size: 10px;
      font-weight: 800;
      backdrop-filter: blur(14px);
    }

    @media (max-width: 640px) {
      .frame-fallback {
        right: 10px;
        bottom: 10px;
        min-height: 38px;
        padding: 0 13px;
        font-size: 9px;
      }
    }
  </style>
</head>
<body>
  <div data-level-navigation data-active="dashboard"></div>

  <iframe
    class="dashboard-frame"
    src="../index.html"
    title="Level Group Performance Dashboard"
    loading="eager"
  ></iframe>

  <a class="frame-fallback" href="../index.html" target="_blank" rel="noopener">Открыть без панели</a>

  <script src="../shared/navigation.js"></script>
  <script src="./targeting-hierarchy.js"></script>
</body>
</html>
