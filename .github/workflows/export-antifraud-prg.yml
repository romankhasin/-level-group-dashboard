name: Export Antifraud PRG 53197618

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/export_antifraud_prg.py"
      - "scripts/analyze_antifraud_prg.py"
      - ".github/workflows/export-antifraud-prg.yml"

permissions:
  contents: read

concurrency:
  group: export-antifraud-prg-53197618
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Export filtered Metrica reports
        env:
          YANDEX_METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
        run: python scripts/export_antifraud_prg.py
      - name: Build comprehensive antifraud HTML
        run: python scripts/analyze_antifraud_prg.py
      - name: Upload exports and report artifact
        uses: actions/upload-artifact@v4
        with:
          name: antifraud-prg-53197618
          path: antifraud_prg_53197618
          retention-days: 14
