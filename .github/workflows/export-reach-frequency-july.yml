name: Export July Reach Frequency

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-reach-frequency-july.yml"
      - "scripts/export_reach_frequency_july_fast2.py"
      - "scripts/export_reach_frequency_july_fast.py"
      - "scripts/export_reach_frequency_july_leaf.py"

permissions:
  contents: write

concurrency:
  group: export-july-reach-frequency
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bitmap dependency
        run: python -m pip install --disable-pip-version-check pyroaring==1.1.0

      - name: Export July Reach/Frequency
        env:
          TARGETADS_TOKEN: ${{ secrets.TARGETADS_TOKEN }}
          TARGETADS_PROJECT_ID: ${{ secrets.TARGETADS_PROJECT_ID }}
        run: python scripts/export_reach_frequency_july_fast2.py

      - name: Commit export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reach_frequency_july_2026.json
          if git diff --cached --quiet; then
            echo "No export changes"
          else
            git commit -m "Export July Reach Frequency"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "main changed during export; rebasing (attempt ${attempt})"
              git pull --rebase origin main
            done
            echo "Could not publish July reach-frequency export"
            exit 1
          fi
