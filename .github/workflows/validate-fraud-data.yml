name: Validate fraud API data pipeline

on:
  pull_request:
    paths:
      - ".github/workflows/update-fraud-data.yml"
      - ".github/workflows/validate-fraud-data.yml"
      - "scripts/update_fraud_data.py"
      - "scripts/update_clientid_periods.py"
      - "scripts/fraud_visit_classifier.py"
      - "scripts/apply_goal_time_buckets.py"
      - "scripts/.goal-time-buckets-trigger"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply goal timing buckets
        run: |
          if [ -f scripts/apply_goal_time_buckets.py ]; then
            python scripts/apply_goal_time_buckets.py
          fi

      - name: Check Python syntax
        run: |
          python -m py_compile scripts/fraud_visit_classifier.py scripts/update_fraud_data.py scripts/update_clientid_periods.py

      - name: Check exact goal timing boundaries
        run: |
          grep -q '"fastAnyGoal3Visits": 0' scripts/update_clientid_periods.py
          grep -q '"fastAnyGoal3Visits": int(minimum_any is not None and 0 <= minimum_any <= 3)' scripts/update_clientid_periods.py
          grep -q '"fastAnyGoal15Visits": int(minimum_any is not None and 3 < minimum_any <= 15)' scripts/update_clientid_periods.py
          grep -q '"fastAnyGoal30Visits": int(minimum_any is not None and 15 < minimum_any <= 30)' scripts/update_clientid_periods.py
          grep -q '"fastAnyGoal3Visits", "fastAnyGoal15Visits", "fastAnyGoal30Visits"' scripts/update_clientid_periods.py

      - name: Check existing fraud methodology
        run: |
          grep -q "DATA_VERSION = 4" scripts/update_fraud_data.py
          grep -q 'CAMPAIGN_TOKENS = ("prg", "med", "mrk")' scripts/update_fraud_data.py
          grep -q "PERIOD_VERSION = 4" scripts/update_clientid_periods.py
          grep -q 'exact-period-metrics-v4-cookie-segments' scripts/update_clientid_periods.py
          grep -q 'def parse_cookie_status' scripts/update_clientid_periods.py
          grep -q '"clientIdByCookie": client_by_cookie' scripts/update_clientid_periods.py
          grep -q '"technicalSegments": segment_summaries' scripts/update_clientid_periods.py
          grep -q '"technicalIntersections"' scripts/update_clientid_periods.py
          grep -q 'unknown_models / mobile_visits' scripts/update_clientid_periods.py
          grep -q 'raw identifiers are not stored' scripts/update_clientid_periods.py

      - name: Commit goal timing backend
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update_clientid_periods.py
          if git diff --cached --quiet; then
            echo "Goal timing backend is already current"
          else
            git commit -m "Split goal timing into 0-3, 4-15 and 16-30 seconds"
            git pull --rebase origin "$TARGET_BRANCH"
            git push origin HEAD:"$TARGET_BRANCH"
          fi
