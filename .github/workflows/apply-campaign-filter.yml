name: Apply campaign filter

on:
  push:
    branches:
      - agent/filter-campaign-types
    paths:
      - "scripts/apply_campaign_filter.py"
      - ".github/workflows/apply-campaign-filter.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/filter-campaign-types

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply filter
        run: python scripts/apply_campaign_filter.py

      - name: Validate syntax and campaign logic
        run: |
          python -m py_compile scripts/fraud_visit_classifier.py scripts/update_fraud_data.py
          python scripts/update_fraud_data.py --self-test
          grep -q 'DATA_VERSION = 3' scripts/update_fraud_data.py
          grep -q '"ym:s:<attribution>UTMCampaign"' scripts/update_fraud_data.py
          grep -q 'CAMPAIGN_TOKENS = ("prg", "med", "mrk")' scripts/update_fraud_data.py
          grep -q 'if not campaign_in_scope(campaign)' scripts/update_fraud_data.py

      - name: Commit applied changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update_fraud_data.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Filter fraud data by PRG MED MRK campaigns"
            git push origin HEAD:agent/filter-campaign-types
          fi
