name: Export full September 2026 reach frequency

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { idx: "01", start: "2026-09-01", end: "2026-09-04" }
          - { idx: "02", start: "2026-09-05", end: "2026-09-08" }
          - { idx: "03", start: "2026-09-09", end: "2026-09-12" }
          - { idx: "04", start: "2026-09-13", end: "2026-09-16" }
          - { idx: "05", start: "2026-09-17", end: "2026-09-20" }
          - { idx: "06", start: "2026-09-21", end: "2026-09-24" }
          - { idx: "07", start: "2026-09-25", end: "2026-09-28" }
          - { idx: "08", start: "2026-09-29", end: "2026-09-30" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyroaring==1.1.0
      - name: Process September raw impressions
        env:
          TARGETADS_TOKEN: ${{ secrets.TARGETADS_TOKEN }}
          TARGETADS_PROJECT_ID: ${{ secrets.TARGETADS_PROJECT_ID }}
        run: python scripts/reach_frequency_chunk_september.py --from-date "${{ matrix.start }}" --to-date "${{ matrix.end }}" --out "september-${{ matrix.idx }}.pkl" --audit-out "september-${{ matrix.idx }}.audit.json"
      - uses: actions/upload-artifact@v4
        with:
          name: reach-september-${{ matrix.idx }}
          path: |
            september-${{ matrix.idx }}.pkl
            september-${{ matrix.idx }}.audit.json
          compression-level: 0
          retention-days: 2

  aggregate:
    needs: chunk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyroaring==1.1.0
      - uses: actions/download-artifact@v4
        with:
          pattern: reach-september-*
          path: september-chunks
          merge-multiple: true
      - run: python scripts/reach_frequency_merge_projects_stream.py --input september-chunks --out data/reach_frequency_september_2026.json --from-date 2026-09-01 --to-date 2026-09-30
      - run: python scripts/reach_frequency_finalize_september.py --report data/reach_frequency_september_2026.json --audits september-chunks
      - uses: actions/upload-artifact@v4
        with:
          name: reach-frequency-september-2026
          path: data/reach_frequency_september_2026.json
          retention-days: 7
