name: Export Target Ads Meta

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-targetads-meta.yml"
      - "scripts/export_targetads_meta.py"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export Target Ads metadata
        env:
          TARGETADS_TOKEN: ${{ secrets.TARGETADS_TOKEN }}
          TARGETADS_PROJECT_ID: ${{ secrets.TARGETADS_PROJECT_ID }}
        run: python scripts/export_targetads_meta.py
      - name: Commit metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/targetads_meta.json
          if git diff --cached --quiet; then
            echo "No metadata changes"
          else
            git commit -m "Export Target Ads metadata"
            git push
          fi
