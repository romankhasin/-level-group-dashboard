name: Apply visit-risk summary

on:
  push:
    branches:
      - agent/visit-risk-summary

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/visit-risk-summary

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply migration
        run: python scripts/apply_visit_risk_summary.py

      - name: Validate classifier and pipeline
        run: |
          python -m py_compile scripts/fraud_visit_classifier.py scripts/update_fraud_data.py
          python scripts/fraud_visit_classifier.py
          python scripts/update_fraud_data.py --self-test
          grep -q '"visitRisk": visit_risk' scripts/update_fraud_data.py
          grep -q 'existing_version < DATA_VERSION' scripts/update_fraud_data.py
          grep -q 'raw IP, ClientID and VisitID are never committed' scripts/update_fraud_data.py

      - name: Commit applied changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update_fraud_data.py
          if ! git diff --cached --quiet; then
            git commit -m "Add visit-level risk summaries"
            git push origin HEAD:agent/visit-risk-summary
          fi
