<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420">
  <!-- Декоративная стилизованная панорама набережной — не фотография конкретного объекта -->
  <line x1="0" y1="300" x2="1600" y2="300" stroke="#9c6b43" stroke-width="1.5" stroke-opacity="0.55"/>

  <!-- причал -->
  <rect x="90" y="300" width="300" height="9" fill="#9c6b43" fill-opacity="0.4"/>
  <line x1="120" y1="309" x2="120" y2="338" stroke="#9c6b43" stroke-width="3" stroke-opacity="0.35"/>
  <line x1="200" y1="309" x2="200" y2="346" stroke="#9c6b43" stroke-width="3" stroke-opacity="0.35"/>
  <line x1="280" y1="309" x2="280" y2="334" stroke="#9c6b43" stroke-width="3" stroke-opacity="0.35"/>
  <line x1="355" y1="309" x2="355" y2="342" stroke="#9c6b43" stroke-width="3" stroke-opacity="0.35"/>

  <g id="skyline" fill="#20233a" fill-opacity="0.55">
    <rect x="520" y="150" width="70" height="150"/>
    <rect x="610" y="108" width="56" height="192"/>
    <rect x="684" y="172" width="64" height="128"/>
    <rect x="770" y="56" width="50" height="244"/>
    <rect x="838" y="128" width="72" height="172"/>
    <rect x="930" y="186" width="58" height="114"/>
    <rect x="1008" y="92" width="46" height="208"/>
    <rect x="1074" y="160" width="68" height="140"/>
    <rect x="1162" y="200" width="52" height="100"/>
    <rect x="1234" y="142" width="60" height="158"/>
  </g>

  <g stroke="#f7f4ef" stroke-width="2" stroke-opacity="0.45">
    <line x1="770" y1="76" x2="820" y2="76"/>
    <line x1="770" y1="106" x2="820" y2="106"/>
    <line x1="770" y1="136" x2="820" y2="136"/>
    <line x1="770" y1="166" x2="820" y2="166"/>
    <line x1="770" y1="196" x2="820" y2="196"/>
    <line x1="770" y1="226" x2="820" y2="226"/>
    <line x1="770" y1="256" x2="820" y2="256"/>
  </g>

  <!-- отражение в воде, зеркально относительно линии горизонта y=300 -->
  <use href="#skyline" transform="translate(0,600) scale(1,-1)" fill-opacity="0.14"/>
</svg>
