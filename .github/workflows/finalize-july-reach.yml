name: Finalize July Reach

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-july-reach.yml"
      - "scripts/reach_reduce_final_stream.py"

permissions:
  contents: write
  actions: read

concurrency:
  group: finalize-july-reach
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyroaring==1.1.0
      - name: Download monthly reducers
        uses: actions/download-artifact@v4
        with:
          pattern: monthly-*
          path: monthly
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: 32052389451
      - name: Build compact report JSON
        run: python scripts/reach_reduce_final_stream.py --input monthly --out data/reach_frequency_july_2026.json
      - name: Commit export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reach_frequency_july_2026.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Export July Reach Frequency by object"
            git pull --rebase origin main
            git push
          fi
