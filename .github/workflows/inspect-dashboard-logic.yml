name: Inspect dashboard merge logic

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: List relevant dashboard functions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          rows=[]
          for m in re.finditer(r'(^|\n)[ \t]*function\s+([A-Za-z0-9_$]+)\s*\(',text,re.M):
              name=m.group(2)
              if any(k in name.lower() for k in ('verifier','budget','cpm','cost','plan','target','google','source')):
                  line=text.count('\n',0,m.start())+1
                  rows.append((line,name))
          lines=text.splitlines()
          direct=[]
          for i,line in enumerate(lines):
              if any(k.lower() in line.lower() for k in ('impressionsWithoutActualCost','hasActualCost','AUTOMATIC_GOOGLE_VERIFIER_ROWS','googleVerifierCoverageKeys','verifierSourceRowKey')) and len(line)<1000:
                  direct.append(f'{i+1:05d}: {line}')
          body=['## Relevant function inventory','```text']
          body += [f'{line:05d}: {name}' for line,name in rows]
          body += ['```','\n## Direct references','```javascript'] + direct + ['```']
          Path('inspection-comment.md').write_text('\n'.join(body),encoding='utf-8')
          PY
      - name: Post inspection to PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file inspection-comment.md
