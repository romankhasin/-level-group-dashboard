name: Export Reach Frequency August 2026

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { idx: "01", start: "2026-08-01", end: "2026-08-04" }
          - { idx: "02", start: "2026-08-05", end: "2026-08-08" }
          - { idx: "03", start: "2026-08-09", end: "2026-08-12" }
          - { idx: "04", start: "2026-08-13", end: "2026-08-14" }
          - { idx: "05", start: "2026-08-15", end: "2026-08-16" }
          - { idx: "06", start: "2026-08-17", end: "2026-08-20" }
          - { idx: "07", start: "2026-08-21", end: "2026-08-24" }
          - { idx: "08", start: "2026-08-25", end: "2026-08-28" }
          - { idx: "09", start: "2026-08-29", end: "2026-08-31" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyroaring==1.1.0
      - name: Process raw-data chunk
        env:
          TARGETADS_TOKEN: ${{ secrets.TARGETADS_TOKEN }}
          TARGETADS_PROJECT_ID: ${{ secrets.TARGETADS_PROJECT_ID }}
        run: python scripts/reach_frequency_chunk_leafonly.py --from-date "${{ matrix.start }}" --to-date "${{ matrix.end }}" --out "august-${{ matrix.idx }}.pkl"
      - uses: actions/upload-artifact@v4
        with:
          name: reach-august-${{ matrix.idx }}
          path: august-${{ matrix.idx }}.pkl
          compression-level: 0
          retention-days: 2

  aggregate:
    needs: chunk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyroaring==1.1.0
      - uses: actions/download-artifact@v4
        with:
          pattern: reach-august-*
          path: august-chunks
          merge-multiple: true
      - run: python scripts/reach_frequency_merge_projects_stream.py --input august-chunks --out data/reach_frequency_august_2026.json --from-date 2026-08-01 --to-date 2026-08-31
      - uses: actions/upload-artifact@v4
        with:
          name: reach-frequency-august-2026
          path: data/reach_frequency_august_2026.json
          retention-days: 7
