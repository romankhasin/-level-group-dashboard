name: Validate fraud API data pipeline

on:
  pull_request:
    paths:
      - ".github/workflows/update-fraud-data.yml"
      - ".github/workflows/validate-fraud-data.yml"
      - "scripts/update_fraud_data.py"
      - "scripts/fraud_visit_classifier.py"
      - "scripts/apply_scoring_stage1.py"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply pending scoring stage 1 migration
        run: |
          if grep -q "DATA_VERSION = 4" scripts/update_fraud_data.py; then
            echo "Scoring stage 1 data changes already applied"
          else
            python scripts/apply_scoring_stage1.py || true
            grep -q "DATA_VERSION = 4" scripts/update_fraud_data.py
            grep -q '"automationVisits": automation_visits' scripts/update_fraud_data.py
          fi

      - name: Commit migration to PR branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update_fraud_data.py .github/workflows/validate-fraud-data.yml
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
          else
            git commit -m "Add volume-aware automation aggregates"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Check Python syntax and aggregation
        run: |
          python -m py_compile scripts/fraud_visit_classifier.py scripts/update_fraud_data.py
          python scripts/fraud_visit_classifier.py
          python scripts/update_fraud_data.py --self-test

      - name: Check visit-level summaries and campaign filter
        run: |
          grep -q "DATA_VERSION = 4" scripts/update_fraud_data.py
          grep -q '"visitRisk": visit_risk' scripts/update_fraud_data.py
          grep -q "existing_version < DATA_VERSION" scripts/update_fraud_data.py
          grep -q 'CAMPAIGN_TOKENS = ("prg", "med", "mrk")' scripts/update_fraud_data.py
          grep -q '"ym:s:<attribution>UTMCampaign"' scripts/update_fraud_data.py
          grep -q 'if not campaign_in_scope(campaign)' scripts/update_fraud_data.py
          grep -q '"campaignFilter": list(CAMPAIGN_TOKENS)' scripts/update_fraud_data.py
          grep -q 'assert campaign_in_scope("LEVEL_PRG_VIDEO")' scripts/update_fraud_data.py
          grep -q 'assert campaign_in_scope("level-med-july")' scripts/update_fraud_data.py
          grep -q 'assert campaign_in_scope("brand_mrk_test")' scripts/update_fraud_data.py
          grep -q 'assert not campaign_in_scope("brand_search_only")' scripts/update_fraud_data.py
          grep -q '"suspiciousVisits": suspicious' scripts/fraud_visit_classifier.py
          grep -q '"highRiskVisits": levels\["high"\]' scripts/fraud_visit_classifier.py
          grep -q '"reviewVisits": levels\["review"\]' scripts/fraud_visit_classifier.py
          grep -q 'assert "client-cluster" not in serialized' scripts/fraud_visit_classifier.py
          grep -q 'assert "10.20.30.40" not in serialized' scripts/fraud_visit_classifier.py

      - name: Check scoring stage 1 data fields
        run: |
          grep -q '"automationVisits": automation_visits' scripts/update_fraud_data.py
          grep -q '"automationShare": automation_visits / visits' scripts/update_fraud_data.py
          grep -q 'directional-volume-multisignal-stage1' scripts/update_fraud_data.py
          grep -q 'assert automation_result\["automationVisits"\] == 1' scripts/update_fraud_data.py

      - name: Check privacy and counter configuration
        run: |
          grep -q "COUNTER_IDS = (53197618, 100470605)" scripts/update_fraud_data.py
          grep -q '"ym:s:visitID"' scripts/update_fraud_data.py
          grep -q '"ym:s:clientID"' scripts/update_fraud_data.py
          grep -q '"ym:s:ipAddress"' scripts/update_fraud_data.py
          grep -q 'entry\["key"\] = "скрыто"' scripts/update_fraud_data.py
          grep -q "raw IP, ClientID and VisitID are never committed" scripts/update_fraud_data.py
          grep -q "YANDEX_METRIKA_TOKEN" .github/workflows/update-fraud-data.yml
          grep -q "data/fraud" .github/workflows/update-fraud-data.yml
          test ! -f scripts/apply_campaign_filter.py
          test ! -f .github/workflows/apply-campaign-filter.yml
